version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
      - cd services/customer-service && npm ci && cd ../..
  pre_build:
    commands:
      - npm test
      - cd services/customer-service && npm test && cd ../..
  build:
    commands:
      - mkdir -p artifact
      - cp -R src views public package.json package-lock.json artifact/
      - cp -R services artifact/services
      - cp appspec.yml buildspec.yml artifact/
      - cp -R deploy artifact/deploy
artifacts:
  files:
    - '**/*'
  base-directory: artifact
  discard-paths: no
